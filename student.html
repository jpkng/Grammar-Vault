<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Vault — Student Log in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#2D3047;--soft:#5C6B8A;--panel:#FFFFFF;--edge:#2D3047;--green:#4CD964;--greenD:#2FAE49;--purple:#7C5CFF;--red:#E14F4F;--bg1:#BDE8FF;--bg2:#E9F7FF}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font-family:"Fredoka",system-ui,sans-serif;color:var(--ink);
       background:linear-gradient(180deg,var(--bg1),var(--bg2));display:flex;align-items:center;justify-content:center;padding:24px 16px}
  .card{width:100%;max-width:560px;background:var(--panel);border:6px solid var(--edge);border-radius:28px;padding:28px 28px 24px;
        box-shadow:0 10px 0 rgba(45,48,71,.25)}
  h1{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:2.2rem;margin:0 0 2px;text-align:center;color:#5B3FE0}
  .sub{text-align:center;color:var(--soft);margin:0 0 18px}
  .tabs{display:flex;gap:10px;margin-bottom:18px}
  .tab{flex:1;padding:12px;border:3px solid var(--edge);border-radius:16px;background:#F3FAFF;font:700 1.1rem "Fredoka",sans-serif;color:var(--ink);cursor:pointer}
  .tab[aria-selected="true"]{background:var(--green);box-shadow:0 4px 0 var(--greenD)}
  label{display:block;font-weight:700;margin:14px 0 6px}
  .hint{font-weight:500;color:var(--soft);font-size:.9rem}
  input[type=text]{width:100%;padding:14px 16px;font:600 1.25rem "Fredoka",sans-serif;border:3px solid #AEB9CC;border-radius:14px;background:#F8FBFF;color:var(--ink)}
  input[type=text]:focus{outline:none;border-color:var(--purple);background:#fff}
  .grades{display:flex;gap:10px}
  .grades button{flex:1;padding:12px;border:3px solid #AEB9CC;border-radius:14px;background:#F8FBFF;font:700 1.2rem "Fredoka",sans-serif;cursor:pointer}
  .grades button[aria-pressed="true"]{border-color:var(--purple);background:#EDE8FF;box-shadow:0 3px 0 var(--purple)}
  .go{width:100%;margin-top:22px;padding:16px;border:4px solid var(--edge);border-radius:18px;background:var(--green);box-shadow:0 6px 0 var(--greenD);
      font:800 1.4rem "Baloo 2",sans-serif;color:#fff;cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.2)}
  .go:disabled{opacity:.6;cursor:wait}
  .err{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#FDEAEA;border:2px solid var(--red);color:#B5352F;font-weight:600}
  .ok{display:none;margin-top:16px;padding:12px 14px;border-radius:12px;background:#E9FBEF;border:2px solid var(--green);color:#1E7A3C;font-weight:600}
  .sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .sug button{padding:6px 12px;border:2px solid var(--purple);border-radius:999px;background:#fff;font:600 .95rem "Fredoka",sans-serif;cursor:pointer}
  .back{display:block;text-align:center;margin-top:18px;color:var(--soft);font-weight:600}
  .panel[hidden]{display:none}
  input[data-pw]{width:100%;padding:14px 16px;font:600 1.25rem "Fredoka",sans-serif;border:3px solid #AEB9CC;border-radius:14px;background:#F8FBFF;color:var(--ink)}
  input[data-pw]:focus{outline:none;border-color:var(--purple);background:#fff}
  label.show{font-weight:500;color:var(--soft);font-size:.95rem;margin:6px 0 0}
  .me{text-align:center;padding:8px 0}
  .me b{font:800 1.5rem "Baloo 2",sans-serif}
</style>
</head>
<body>
<main class="card">
  <h1>Grammar Vault</h1>
  <p class="sub">Student account</p>
  <div id="already" class="me" hidden>
    <p>You are logged in as<br><b id="meName"></b><br><span class="hint" id="meId"></span></p>
    <button class="go" id="playBtn" type="button">Play!</button>
    <a class="tab" href="student_progress.html" style="display:block;margin-top:12px;text-align:center;text-decoration:none">My Progress</a>
    <button class="tab" id="switchBtn" type="button" style="margin-top:12px;width:100%">Not you? Log out</button>
  </div>
  <div id="forms">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tabLogin" aria-selected="true" type="button">Log in</button>
      <button class="tab" role="tab" id="tabReg" aria-selected="false" type="button">Register</button>
    </div>
    <form id="loginForm" class="panel" autocomplete="off" novalidate>
      <label for="ident">Student ID or username <span class="hint">(for example 12-3456-789)</span></label>
      <input type="text" id="ident" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="30" autofocus>
      <label for="lpw">Password</label>
      <input type="password" id="lpw" maxlength="72" autocomplete="current-password">
      <label class="show"><input type="checkbox" class="showpw"> Show password</label>
      <button class="go" type="submit">Log in</button>
    </form>
    <form id="pwForm" class="panel" autocomplete="off" novalidate hidden>
      <p><strong>Create a password for your account.</strong><br><span class="hint">Your account was made before passwords. Type your full name as it is on your account, then choose a password.</span></p>
      <label for="pname">Full name</label>
      <input type="text" id="pname" maxlength="60" placeholder="Juan Dela Cruz">
      <label for="pnew">New password <span class="hint">(at least 4 letters or numbers)</span></label>
      <input type="password" id="pnew" maxlength="72" autocomplete="new-password">
      <label class="show"><input type="checkbox" class="showpw"> Show password</label>
      <button class="go" type="submit">Save password and log in</button>
    </form>
    <form id="regForm" class="panel" autocomplete="off" novalidate hidden>
      <label for="rno">Student ID <span class="hint">(required — like 12-3456-789)</span></label>
      <input type="text" id="rno" inputmode="numeric" maxlength="11" placeholder="12-3456-789">
      <label for="rname">Full name <span class="hint">(required — first and last name)</span></label>
      <input type="text" id="rname" maxlength="60" placeholder="Juan Dela Cruz" autocomplete="off">
      <label>Grade</label>
      <div class="grades" id="grades">
        <button type="button" data-g="2" aria-pressed="false">Grade 2</button>
        <button type="button" data-g="3" aria-pressed="false">Grade 3</button>
        <button type="button" data-g="4" aria-pressed="false">Grade 4</button>
      </div>
      <label for="rteacher">Your teacher's name <span class="hint">(like Ms. Rivera — skip this if your teacher already added you)</span></label>
      <input type="text" id="rteacher" maxlength="30" placeholder="Ms. Rivera">
      <div class="sug" id="sug"></div>
      <label for="rpw">Choose a password <span class="hint">(required — at least 4 letters or numbers)</span></label>
      <input type="password" id="rpw" maxlength="72" autocomplete="new-password">
      <label for="rpw2">Type the password again</label>
      <input type="password" id="rpw2" maxlength="72" autocomplete="new-password">
      <label class="show"><input type="checkbox" class="showpw"> Show password</label>
      <label for="ruser">Pick a username <span class="hint">(optional — you can always log in with your Student ID)</span></label>
      <input type="text" id="ruser" maxlength="30" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="coolfox7">
      <button class="go" type="submit">Create my account</button>
    </form>
    <div class="err" id="err" role="alert"></div>
    <div class="ok" id="okmsg" role="status"></div>
  </div>
  <a class="back" href="index2.html">&larr; Back to the game</a>
</main>
<script>
(function(){
  const KEY='gv_student';
  const $=id=>document.getElementById(id);
  let grade=0;
  function show(el,msg){ $('err').style.display='none'; $('okmsg').style.display='none'; if(el&&msg){ $(el).textContent=msg; $(el).style.display='block'; } }
  function setTab(login){
    $('tabLogin').setAttribute('aria-selected',login); $('tabReg').setAttribute('aria-selected',!login);
    $('loginForm').hidden=!login; $('regForm').hidden=login; $('pwForm').hidden=true; show();
    (login?$('ident'):$('rno')).focus();
  }
  $('tabLogin').onclick=()=>setTab(true);
  $('tabReg').onclick=()=>setTab(false);
  $('rno').addEventListener('input',()=>{
    const d=$('rno').value.replace(/\D/g,'').slice(0,9);
    let o=d.slice(0,2); if(d.length>2)o+='-'+d.slice(2,6); if(d.length>6)o+='-'+d.slice(6);
    $('rno').value=o;
  });
  $('ident').addEventListener('input',()=>{
    const v=$('ident').value;
    if(/^[\d\-\s.]+$/.test(v)){
      const d=v.replace(/\D/g,'').slice(0,9);
      let o=d.slice(0,2); if(d.length>2)o+='-'+d.slice(2,6); if(d.length>6)o+='-'+d.slice(6);
      $('ident').value=o;
    }
  });
  document.querySelectorAll('input[type=password]').forEach(i=>i.setAttribute('data-pw','1'));
  document.querySelectorAll('.showpw').forEach(cb=>cb.addEventListener('change',()=>{ cb.closest('form').querySelectorAll('input[data-pw]').forEach(i=>{ i.type=cb.checked?'text':'password'; }); }));
  document.querySelectorAll('#grades button').forEach(b=>b.onclick=()=>{
    grade=+b.dataset.g;
    document.querySelectorAll('#grades button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  });
  let sugTimer=null;
  $('rteacher').addEventListener('input',()=>{
    clearTimeout(sugTimer);
    const t=$('rteacher').value.trim();
    if(t.length<2){ $('sug').innerHTML=''; return; }
    sugTimer=setTimeout(async()=>{
      try{
        const r=await fetch('results_api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'suggest_teachers',teacher:t})});
        const d=await r.json(); const box=$('sug'); box.innerHTML='';
        if(d&&d.success) d.matches.forEach(m=>{ const b=document.createElement('button'); b.type='button'; b.textContent=m;
          b.onclick=()=>{ $('rteacher').value=m; box.innerHTML=''; }; box.appendChild(b); });
      }catch(e){}
    },250);
  });
  async function call(payload){
    try{
      const r=await fetch('student_api.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
      const d=await r.json();
      if(d&&d.success) return {ok:true,student:d.student,token:d.token};
      return {ok:false,needsPw:!!(d&&d.needs_password),error:(d&&d.error)||'Something went wrong.'};
    }catch(e){ return {ok:false,error:"Can't reach the game server. Ask your teacher to start the game with start_game.bat."}; }
  }
  function finish(st,token){
    try{ localStorage.setItem(KEY,JSON.stringify(Object.assign({},st,{token:token}))); }catch(e){}
    show('okmsg','Welcome, '+st.first_name+'! Starting the game…');
    setTimeout(()=>{ location.href='index2.html'; },700);
  }
  let pendingIdent='';
  $('loginForm').addEventListener('submit',async e=>{
    e.preventDefault(); const v=$('ident').value.trim();
    if(!v){ show('err','Please type your Student ID or username.'); return; }
    const btn=e.target.querySelector('.go'); btn.disabled=true; show();
    const r=await call({action:'login',id:v,password:$('lpw').value}); btn.disabled=false;
    if(r.ok) finish(r.student,r.token);
    else if(r.needsPw){ pendingIdent=v; $('loginForm').hidden=true; $('pwForm').hidden=false; $('pname').focus(); }
    else show('err',r.error);
  });
  $('pwForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const name=$('pname').value.trim().replace(/\s+/g,' '), pw=$('pnew').value;
    if(name.split(' ').length<2){ show('err','Please type your full name (first and last name).'); return; }
    if(pw.length<4){ show('err','Your password needs at least 4 letters or numbers.'); return; }
    const btn=e.target.querySelector('.go'); btn.disabled=true; show();
    const r=await call({action:'set_password',id:pendingIdent,full_name:name,password:pw}); btn.disabled=false;
    r.ok?finish(r.student,r.token):show('err',r.error);
  });
  $('regForm').addEventListener('submit',async e=>{
    e.preventDefault();
    const no=$('rno').value.trim(), name=$('rname').value.trim().replace(/\s+/g,' ');
    if(!/^\d{2}-\d{4}-\d{3}$/.test(no)){ show('err','Your Student ID must look like 12-3456-789.'); return; }
    if(name.split(' ').length<2||name.length<4){ show('err','Please type your full name (first and last name).'); return; }
    const pw=$('rpw').value;
    if(pw.length<4){ show('err','Your password needs at least 4 letters or numbers.'); return; }
    if(pw!==$('rpw2').value){ show('err','The two passwords are not the same. Please type them again.'); return; }
    const btn=e.target.querySelector('.go'); btn.disabled=true; show();
    const r=await call({action:'register',student_no:no,full_name:name,password:pw,grade:grade,teacher:$('rteacher').value.trim(),username:$('ruser').value.trim()});
    btn.disabled=false;
    r.ok?finish(r.student,r.token):show('err',r.error);
  });
  try{
    const st=JSON.parse(localStorage.getItem(KEY)||'null');
    if(st&&st.student_no&&st.token){
      $('forms').hidden=true; $('already').hidden=false;
      $('meName').textContent=st.full_name; $('meId').textContent=st.student_no;
      $('playBtn').onclick=()=>{ location.href='index2.html'; };
      $('switchBtn').onclick=()=>{ try{localStorage.removeItem(KEY);}catch(e){} location.reload(); };
    }
  }catch(e){}
})();
</script>
</body>
</html>
