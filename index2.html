let questionBank = {};
function parseQuestions(text) {
  const bank = {};
  let cat = 'General', cur = null;
  function isValid(c) {
    if (!c || !c.q) return false;
    if (c.type === 'TYPED') return Array.isArray(c.ans) && c.ans.length > 0;
    return c.opts.length >= 2;
  }
  function commit(c) { if (isValid(c)) { if (!bank[cat]) bank[cat] = []; bank[cat].push(c); } }
  for (let raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line || line.startsWith('#')) continue;
    if (line.startsWith('CATEGORY:')) {
      cat = line.slice(9).trim();
      if (!bank[cat]) bank[cat] = [];
    } else if (line.startsWith('Q:')) {
      cur = { q: line.slice(2).trim(), type: 'MC', topic: '', opts: [], ans: 0, explain: '' };
    } else if (line.startsWith('TOPIC:') && cur) {
      cur.topic = line.slice(6).trim().toLowerCase();
    } else if (line.startsWith('TYPE:') && cur) {
      cur.type = line.slice(5).trim().toUpperCase() === 'TYPED' ? 'TYPED' : 'MC';
    } else if (line.startsWith('O:') && cur) {
      cur.opts.push(line.slice(2).trim());
    } else if (line.startsWith('A:') && cur) {
      const val = line.slice(2).trim();
      if (cur.type === 'TYPED') cur.ans = val.split('|').map(s => s.trim()).filter(Boolean);
      else cur.ans = parseInt(val, 10);
    } else if (line.startsWith('E:') && cur) {
      cur.explain = line.slice(2).trim();
    } else if (line === '---' && cur) {
      commit(cur);
      cur = null;
    }
  }
  commit(cur);
  return bank;
}
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
let seenQ={};
function qKey(q){return q.q+'\u0001'+(q.opts||[]).join('\u0002')+'\u0001'+(Array.isArray(q.ans)?q.ans.join('|'):q.ans);}
function pickQuestion(category, excludeQ, mark, topic) {
  let pool = questionBank[category] ? [...questionBank[category]] : [];
  if (topic) { const tp = pool.filter(q => q.topic === topic); if (tp.length >= 3) pool = tp; }
  if (!pool.length) {
    for (const k of Object.keys(questionBank)) pool.push(...questionBank[k]);
  }
  if (!pool.length) return null;
  const ex = Array.isArray(excludeQ) ? excludeQ : (excludeQ ? [excludeQ] : []);
  if (ex.length && pool.length > ex.length) {
    const filtered = pool.filter(q => !ex.includes(qKey(q)));
    if (filtered.length) pool = filtered;
  }
  const seen = seenQ[category] || (seenQ[category] = new Set());
  let fresh = pool.filter(q => !seen.has(qKey(q)));
  if (!fresh.length) { pool.forEach(q => seen.delete(qKey(q))); fresh = pool; }
  const pick = shuffle(fresh)[0];
  if (mark) seen.add(qKey(pick));
  return pick;
}

  if(!LEVEL_TEMPLATES[d.lvlIdx]||!Array.isArray(d.done)||d.done.length!==LEVEL_TEMPLATES[d.lvlIdx].npcs.length){toast('That save is from an older version of the game (the levels changed).',false);return;}

    if(d.name){playerName=d.name;saveName();}

    npc.done=d.done[idx]||false;
    npc.best=(d.best&&d.best[idx]!==undefined)?d.best[idx]:(npc.done?levelReq().pass:-1);

  {
    const sgx=Math.floor((player.x+TILE*.5)/TILE),sgy=Math.floor((player.y+TILE*.7)/TILE);

function currentWallSet(){

function walled(gx,gy){
  if(gx<0||gy<0||gx>=COLS||gy>=ROWS)return true;
  if(currentWallSet().has(gx+','+gy))return true;
  for(const n of npcs)if(n.gx===gx&&n.gy===gy)return true;
  return false;
}

function interact(){

    if(typeof stopSpeaking==='function')stopSpeaking();
    if(typeof sttStop==='function')sttStop();

    if(npc.rIdx<ROUNDQ-1){
      npc.rIdx++;setNpcQuestion(npc,npc.rQs[npc.rIdx]);
      quizAnswered=false;chosenIdx=-1;typedAnswer='';typeInputEl.value='';startQuestionTimer();

}
function finishRound(npc){
  const req=levelReq(),correct=npc.rCorrect;
  const passed=correct>=req.pass,perfect=correct===ROUNDQ,first=!npc.done&&passed;
  const mult=npc.rMode==='learn'?1:PTS_PRACTICE_MULT;
  const perfBonus=perfect?Math.round(PTS_PERFECT*mult):0;
  const mastBonus=first?PTS_MASTER:0;
  addPoints(perfBonus+mastBonus);
  npc.rounds++;
  if(correct>npc.best)npc.best=correct;
  if(first)npc.done=true;
  lastRound={npc,mode:npc.rMode,correct,passed,perfect,first,res:[...npc.rRes],ans:npc.rAns,perfBonus,mastBonus,total:npc.rAns+perfBonus+mastBonus};
  playBeep(passed?784:220,0.25,0.1);
  gameState='roundResult';
}

function applyAnswerResult(npc,correct){
  npc.rRes.push(!!correct);
  feedbackPts=0;feedbackStreakBonus=0;
  if(correct){
    score++;streak++;bestStreak=Math.max(bestStreak,streak);npc.rCorrect++;
    const mult=npc.rMode==='learn'?1:PTS_PRACTICE_MULT;
    const sb=Math.min(streak-1,PTS_STREAK_CAP)*PTS_STREAK_STEP;
    const base=npc.type==='TYPED'?PTS_TYPED:PTS_MC;
    feedbackPts=Math.round((base+sb)*mult);feedbackStreakBonus=Math.round(sb*mult);
    addPoints(feedbackPts);npc.rAns+=feedbackPts;
    playBeep(660,0.2,0.1);
  } else {streak=0;playBeep(220,0.3,0.08);}
  feedbackOk=correct;feedbackText=npc.explain;
}

function update(){
  fc++;if(toastTimer>0)toastTimer--;tickMusic();if(typeof bgmUpdateScene==='function')bgmUpdateScene(scene);
  if(scene!=='game')return;
  if(gameState==='banner'){bannerTimer--;if(bannerTimer<=0)gameState='play';return;}
  if(gameState==='quiz'&&!quizAnswered&&activeNPC){tickQuestionTimer();return;}
  if(gameState!=='play')return;
  const spd=7;let px=player.x,py=player.y,moved=false;
  if(useLeft()){px-=spd;player.dir=3;moved=true;}
  if(useRight()){px+=spd;player.dir=1;moved=true;}
  if(useUp()){py-=spd;player.dir=0;moved=true;}
  if(useDown()){py+=spd;player.dir=2;moved=true;}
  if(moved)player.frame=Math.floor(fc/8)%4;
  const ngx=Math.floor((px+TILE*.5)/TILE),ngy=Math.floor((py+TILE*.7)/TILE);
  if(!walled(ngx,ngy)){player.x=px;player.y=py;}
  player.x=Math.max(0,Math.min(player.x,(COLS-1)*TILE));
  player.y=Math.max(0,Math.min(player.y,(ROWS-1)*TILE));
  nearNPC=null;let nearD=1e9;
  for(const n of npcs){
    if(n.done&&!reviewAllowed(n))continue;
    const d=Math.hypot((n.gx*TILE+TILE*.5)-(player.x+TILE*.5),(n.gy*TILE+TILE*.5)-(player.y+TILE*.5));
    if(d<TILE*2&&d<nearD){nearD=d;nearNPC=n;}
  }
  if(gateOpen()){
    const ex=(COLS-2)*TILE,ey=TILE;
    if(Math.hypot(ex-player.x,ey-player.y)<TILE*2.5){
      gameState='levelComplete';awardLevelBonus();playBeep(784,0.25,0.12);
      if(typeof gvLogLevelComplete==='function')gvLogLevelComplete();
    }
  }
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}
function wrapT(txt,maxW){
  const words=txt.split(' '),lines=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(ctx.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;}else cur=t;}
  if(cur)lines.push(cur);return lines;
}

function drawFloatingLetters(){
  const safeX1=470, safeX2=1450, safeY1=380, safeY2=920;
  for(let i=0;i<14;i++){
    const seedX=(i*137)%VW, baseY=(i*97)%VH;
    const x=(seedX+Math.sin(fc*0.01+i)*24+VW)%VW;
    const y=((baseY - fc*0.35*(1+(i%3)*0.3))%(VH+80)+VH+80)%(VH+80)-40;
    if(x>safeX1&&x<safeX2&&y>safeY1&&y<safeY2)continue;
    ctx.save();
    ctx.globalAlpha=0.14+0.07*(i%3);
    ctx.fillStyle=FLOAT_COLORS[i%FLOAT_COLORS.length];
    ctx.font=`700 ${34+(i%3)*14}px "Fredoka", sans-serif`;
    ctx.textAlign='center';
    ctx.fillText(FLOAT_GLYPHS[i%FLOAT_GLYPHS.length],x,y);
    ctx.restore();
  }
}

function hashTile(c,r){
  let h=(c*374761393+r*668265263)|0;
  h=(h^(h>>>13))*1274126177|0;
  return ((h^(h>>>16))>>>0);
}
function tileRand(c,r,salt){return (hashTile(c+salt*131,r)%1000)/1000;}

function drawStarShape(cx,cy,rOuter,rInner,points){
  ctx.beginPath();
  for(let i=0;i<points*2;i++){
    const rad=(i%2===0)?rOuter:rInner;
    const a=(Math.PI/points)*i-Math.PI/2;
    const px=cx+Math.cos(a)*rad,py=cy+Math.sin(a)*rad;
    if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function drawExitPortal(x,y,T,color){
  const cx=x+T/2,cy=y+T/2,p=.5+.5*Math.sin(fc*.08);

  ctx.fillStyle=color;ctx.beginPath();ctx.arc(cx,cy,T*(.9+.3*p),0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=1;
  for(let i=0;i<8;i++){
    const a=fc*0.04+i*Math.PI/4, rr2=T*0.55;
    ctx.globalAlpha=0.5+0.5*Math.sin(fc*0.1+i);
    ctx.fillStyle=color;
    ctx.beginPath();ctx.arc(cx+Math.cos(a)*rr2,cy+Math.sin(a)*rr2,3.5,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
  ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(cx,cy,T*0.22,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=color;ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,T*0.22,0,Math.PI*2);ctx.stroke();
  ctx.fillStyle=color;ctx.font='800 20px "Baloo 2", sans-serif';ctx.textAlign='center';
  ctx.fillText('\u2B50',cx,cy+7);
  ctx.fillStyle=shade(color,-0.3);ctx.font='700 16px "Fredoka", sans-serif';
  ctx.fillText('EXIT',cx,y+T+22);
  ctx.restore();
}
let worldCacheCanvas=null, worldCacheCtx=null, worldCacheLvlIdx=-1, worldWallSet=null;
const WALL_ANIM_SKINS  = new Set(['cavern','sanctuary']);
const DECOR_ANIM_SKINS = new Set(['valley','swamp','hollow','inlet','cavern','grammarium']);
function withCtx(targetCtx, fn){
  const prev = ctx;
  ctx = targetCtx;
  try{ fn(); } finally { ctx = prev; }
}
function buildWorldCache(){
  const lv = LEVEL_TEMPLATES[lvlIdx];
  if(!worldCacheCanvas){
    worldCacheCanvas = document.createElement('canvas');
    worldCacheCanvas.width = VW; worldCacheCanvas.height = VH;
    worldCacheCtx = worldCacheCanvas.getContext('2d');
  }
  worldWallSet = new Set(levelWalls().map(w=>w[0]+','+w[1]));
  const accentSet = new Set((lv.accent||[]).map(a=>a[0]+','+a[1]));
  withCtx(worldCacheCtx, ()=>{
    ctx.clearRect(0,0,VW,VH);
    const lastColW=TILE+(VW-COLS*TILE);
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      ctx.fillStyle=(c+r)%2===0?lv.t1:lv.t2;
      ctx.fillRect(c*TILE,r*TILE,c===COLS-1?lastColW:TILE,TILE);
    }
    if(accentSet.size){
      ctx.save();
      for(const k of accentSet){
        const [ac,ar]=k.split(',').map(Number);
        const ax=ac*TILE,ay=ar*TILE;
        ctx.globalAlpha=0.30;ctx.fillStyle=lv.exit;
        chRoundRectPath(ctx,ax+3,ay+3,TILE-6,TILE-6,14);ctx.fill();
        ctx.globalAlpha=0.35;ctx.strokeStyle='#FFFFFF';ctx.lineWidth=2;
        chRoundRectPath(ctx,ax+9,ay+9,TILE-18,TILE-18,10);ctx.stroke();
      }
      ctx.restore();
    }
    if(lv.skin && !DECOR_ANIM_SKINS.has(lv.skin)){
      for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
        if(worldWallSet.has(c+','+r)||accentSet.has(c+','+r))continue;
        if(c===11&&r===6)continue;
        if(c===COLS-2&&r===1)continue;
        drawFloorDecoration(lv.skin,c,r,c*TILE,r*TILE,TILE);
      }
    }
    if(!(lv.skin && WALL_ANIM_SKINS.has(lv.skin))){
      for(const[wx,wy]of levelWalls()){
        if(wy===0)continue;
        if(lv.skin)drawThemedWall(lv.skin,wx*TILE,wy*TILE,TILE,lv.wall);
        else{ctx.fillStyle=lv.wall;ctx.fillRect(wx*TILE+2,wy*TILE+2,TILE-4,TILE-4);ctx.fillStyle='rgba(255,255,255,0.06)';ctx.fillRect(wx*TILE+2,wy*TILE+2,TILE-4,8);}
      }
    }
  });
  worldCacheLvlIdx = lvlIdx;
}
function drawWorld(){
  const lv=LEVEL_TEMPLATES[lvlIdx];
  if(lvlIdx!==worldCacheLvlIdx || !worldCacheCanvas) buildWorldCache();
  ctx.drawImage(worldCacheCanvas,0,0);
  if(lv.skin && DECOR_ANIM_SKINS.has(lv.skin)){
    if(!lv._accentSet)lv._accentSet=new Set((lv.accent||[]).map(a=>a[0]+','+a[1]));
    for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
      if(worldWallSet.has(c+','+r)||lv._accentSet.has(c+','+r))continue;
      if(c===11&&r===6)continue;
      if(c===COLS-2&&r===1)continue;
      drawFloorDecoration(lv.skin,c,r,c*TILE,r*TILE,TILE);
    }
  }
  if(lv.skin && WALL_ANIM_SKINS.has(lv.skin)){
    for(const[wx,wy]of levelWalls()){if(wy>0)drawThemedWall(lv.skin,wx*TILE,wy*TILE,TILE,lv.wall);}
  }
  if(!gateOpen()){
    const ex=(COLS-2)*TILE,ey=TILE,gcx=ex+TILE/2,gcy=ey+TILE/2,left=npcs.filter(n=>!n.done).length;
    ctx.save();
    ctx.globalAlpha=0.55;ctx.strokeStyle=lv.exit;ctx.lineWidth=5;ctx.setLineDash([10,8]);
    ctx.beginPath();ctx.arc(gcx,gcy,TILE*0.42,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
    ctx.globalAlpha=0.85;ctx.fillStyle='rgba(45,48,71,0.78)';
    chRoundRectPath(ctx,gcx-24,gcy-22,48,44,12);ctx.fill();
    ctx.font='22px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle='#FFFFFF';
    ctx.fillText('\u{1F512}',gcx,gcy-4);
    ctx.font='700 14px "Fredoka", sans-serif';ctx.fillText(left>0?String(left):(levelReq().acc+'%'),gcx,gcy+14);
    ctx.textBaseline='alphabetic';
    ctx.restore();
  }
  if(gateOpen()){
    const ex=(COLS-2)*TILE,ey=TILE;
    if(lv.skin)drawExitPortal(ex,ey,TILE,lv.exit);
    else{
      const p=.5+.5*Math.sin(fc*.08);
      ctx.fillStyle=lv.exit;ctx.globalAlpha=.1+.14*p;
      ctx.beginPath();ctx.arc(ex+TILE/2,ey+TILE/2,TILE*(.9+.3*p),0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;ctx.fillStyle=lv.exit;ctx.font='bold 22px monospace';ctx.textAlign='center';
      ctx.fillText('EXIT',ex+TILE/2,ey+TILE*.46);ctx.font='18px monospace';ctx.fillStyle='#fff';ctx.fillText('walk here',ex+TILE/2,ey+TILE*.76);
    }
  }
}
function drawNPCs(){
  for(const n of npcs){
    const x=n.gx*TILE,y=n.gy*TILE,bob=Math.sin(fc*.07+n.id)*4,cx=x+TILE/2,topY=y+bob;
    if(!n.done||reviewAllowed(n)){
      ctx.globalAlpha=.12+.1*Math.sin(fc*.1+n.id);
      ctx.fillStyle=n.color;ctx.beginPath();ctx.arc(cx,y+TILE*.55+bob,TILE*.85,0,Math.PI*2);ctx.fill();
      ctx.globalAlpha=1;
    }
    if(typeof drawNPC==='function'){
      drawNPC(ctx,x,y,TILE,n,bob);
    } else {
      ctx.fillStyle=n.done?'#333':n.color;ctx.beginPath();ctx.arc(cx,y+TILE/2+bob,TILE*.35,0,Math.PI*2);ctx.fill();
    }
    if(n.done){
      const bx=cx+TILE*0.32,by=y+TILE*0.12+bob;
      ctx.fillStyle=reviewAllowed(n)?'#FF9F45':(n.best>=ROUNDQ?'#FFB800':'#4CD964');ctx.beginPath();ctx.arc(bx,by,TILE*0.17,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(bx,by,TILE*0.17,0,Math.PI*2);ctx.stroke();
      ctx.fillStyle='#fff';ctx.font='bold 20px "Fredoka", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(reviewAllowed(n)?'\u21BB':(n.best>=ROUNDQ?'\u2605':'\u2713'),bx,by+1);
      ctx.textBaseline='alphabetic';
    }
    if(nearNPC&&nearNPC.id===n.id&&(!n.done||reviewAllowed(n))&&gameState==='play'){
      ctx.fillStyle='#FFD23F';ctx.font='700 26px "Fredoka", sans-serif';ctx.textAlign='center';
      ctx.shadowColor='rgba(0,0,0,0.4)';ctx.shadowBlur=4;
      ctx.fillText(n.done?'\u{1F501} Review (E)':(n.rounds>0?'\u{1F4AC} Try again (E)':'\u{1F4AC} Press E'),cx,topY-TILE*0.95);
      ctx.shadowBlur=0;
    }
    ctx.font='700 19px "Fredoka", sans-serif';ctx.textAlign='center';
    const nw=ctx.measureText(n.name).width;
    const pillW=Math.max(nw+34,96),pillH=54,pillX=cx-pillW/2,pillY=y+TILE+10;
    ctx.save();
    ctx.shadowColor='rgba(0,0,0,0.25)';ctx.shadowOffsetY=3;
    ctx.fillStyle='#FFFFFF';rr(pillX,pillY,pillW,pillH,16);ctx.fill();
    ctx.restore();
    ctx.strokeStyle=n.color;ctx.lineWidth=3;rr(pillX,pillY,pillW,pillH,16);ctx.stroke();
    ctx.fillStyle='#2D3047';ctx.fillText(n.name,cx,pillY+22);
    ctx.font='600 14px "Fredoka", sans-serif';ctx.fillStyle=n.color;
    ctx.fillText(n.category,cx,pillY+41);
  }
}

    if(typeof LEVEL_TEMPLATES==='undefined'||typeof WALLS==='undefined')throw new Error('levels.js did not load — make sure levels.js is in the same folder as index2.html and is linked with a script tag pointing to levels.js.');
    if(!Array.isArray(LEVEL_TEMPLATES)||LEVEL_TEMPLATES.length===0)throw new Error('levels.js loaded but contained no levels.');
    console.log(`Grammar Vault: ${LEVEL_TEMPLATES.length} levels loaded (NPC counts: ${LEVEL_TEMPLATES.map(l=>l.npcs.length).join(', ')}).`);
  }catch(err){
    hadError=true; errMsgs.push(err.message);
    window.LEVEL_TEMPLATES=[
      { name:'Fallback Village', bg:'#0d1a0d',t1:'#142114',t2:'#111811',wall:'#2d5c2d',exit:'#ffd700',
        npcs:[
          {gx:5, gy:5, color:'#ff8866',name:'Grammar Guide',    category:'Grammar'},
          {gx:15,gy:5, color:'#44ffcc',name:'Punctuation Pal',  category:'Punctuation'},
          {gx:10,gy:10,color:'#ffaa44',name:'Spelling Scout',   category:'Spelling'},
        ]},
    ];
    window.WALLS=[];
  }
  if(hadError){
    document.getElementById('err-msg').textContent=`Warning: ${errMsgs.join('  ')} — using built-in fallback data.`;
    await new Promise(r=>setTimeout(r,2500));
  }
  document.getElementById('loading').style.display='none';
  canvas.style.display='block';
  try{
    if(localStorage.getItem('gv_return_to_game')==='1'){
      localStorage.removeItem('gv_return_to_game');
      loadName();loadGrade();
      beginAdventure(true);
    }
  }catch(e){}
  loop();
}
let touchOrigin=null;
canvas.addEventListener('touchstart',e=>{touchOrigin={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault();},{passive:false});
canvas.addEventListener('touchmove',e=>{
  if(!touchOrigin)return;
  const dx=e.touches[0].clientX-touchOrigin.x,dy=e.touches[0].clientY-touchOrigin.y;
  keys['ArrowLeft']=dx<-22;keys['ArrowRight']=dx>22;keys['ArrowUp']=dy<-22;keys['ArrowDown']=dy>22;
  e.preventDefault();
},{passive:false});
canvas.addEventListener('touchend',e=>{
  keys['ArrowLeft']=keys['ArrowRight']=keys['ArrowUp']=keys['ArrowDown']=false;
  const sc=getScale(),r=canvas.getBoundingClientRect();
  const mx=(e.changedTouches[0].clientX-r.left)*sc.x,my=(e.changedTouches[0].clientY-r.top)*sc.y;
  for(const c of clickables)if(mx>=c.x&&mx<=c.x+c.w&&my>=c.y&&my<=c.y+c.h){playBeep(440,.06,.1);c.fn();break;}
  touchOrigin=null;e.preventDefault();
},{passive:false});
init();
</script>
